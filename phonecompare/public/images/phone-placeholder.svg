<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2c32" />
      <stop offset="50%" stop-color="#1d1e22" />
      <stop offset="100%" stop-color="#141518" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121316" />
      <stop offset="100%" stop-color="#090a0c" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c1382a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#e04e3e" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="300" r="180" fill="url(#accentGlow)" />

  <!-- Phone Body -->
  <rect x="70" y="40" width="260" height="520" rx="42" fill="url(#bodyGrad)" stroke="#3a3d45" stroke-width="2.5" filter="url(#shadow)" />

  <!-- Inner Bezel -->
  <rect x="80" y="52" width="240" height="496" rx="34" fill="#000000" stroke="#1f2126" stroke-width="1.5" />

  <!-- Screen -->
  <rect x="84" y="56" width="232" height="488" rx="30" fill="url(#screenGrad)" />

  <!-- Dynamic Island / Hole Punch -->
  <rect x="175" y="70" width="50" height="14" rx="7" fill="#000000" stroke="#25272c" stroke-width="1" />
  <circle cx="187" cy="77" r="3.5" fill="#15171b" />

  <!-- Subtle screen line artwork -->
  <line x1="120" y1="260" x2="280" y2="260" stroke="#26282f" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="140" y1="280" x2="260" y2="280" stroke="#26282f" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Static Phone Icon / Branding -->
  <g transform="translate(180, 310)" stroke="#c1382a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="40" height="64" rx="6" />
    <line x1="14" y1="52" x2="26" y2="52" />
  </g>

  <!-- Side Buttons -->
  <rect x="67" y="140" width="3" height="40" rx="1.5" fill="#454850" />
  <rect x="67" y="190" width="3" height="40" rx="1.5" fill="#454850" />
  <rect x="330" y="160" width="3" height="55" rx="1.5" fill="#454850" />
</svg>
